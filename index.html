<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/specimen/Figtree?query=figtree&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main class="container" aria-label="Blog preview card">
      <div class="card">
        <div class="card__image"></div>
        <div class="card__content">
          <p>Learning</p>
          <p>Published 21 Dec 2023</p>
          <h1>HTML & CSS foundations</h1>
          <p>
            Learning Published 21 Dec 2023 HTML & CSS foundations These
            languages are - the backbone of every website, defining structure,
            content, and - presentation. Greg Hooper
          </p>
        </div>
        <div class="card__author">
          <div class="card__author-image">
            <img
              src="./assets/images/avatar-michelle.jpg"
              alt="Michelle Avatar"
            />
          </div>
          <p>By Greg Hooper</p>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://pramitsingh.netlify.app">Pramit Singh</a>.
    </footer>
  </body>
</html>
